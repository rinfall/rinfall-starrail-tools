[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rinfall-starrail-tools"
version = "0.1.0"
description = "A lightweight, robust automation tool for Honkai: Star Rail"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "rinfall" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "pywin32>=306; sys_platform == 'win32'",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.7",
    "pyperclip>=1.8.2",
    "rapidocr-onnxruntime>=1.3.0",
    "loguru>=0.7.2",
]

[project.scripts]
rst = "starrail_tools.main:main"

[tool.setuptools.packages.find]
where = ["src"]
